# Project-wide Gradle settings

# Enable AndroidX artifact mapping
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Use the new Kotlin daemon (faster incremental builds)
kotlin.daemon.jvm.options=-Xmx2g -XX:+UseParallelGC

# Gradle JVM heap
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel builds
org.gradle.parallel=true

# Configuration cache (speeds up build configuration phase)
org.gradle.configuration-cache=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Suppress compileSdk 36 warning on AGP 8.5
android.suppressUnsupportedCompileSdk=36
